name: Import reconstructed movement history

on:
  push:
    branches:
      - history/import-mouvements-2026
    paths:
      - .history-import/ready.json

permissions:
  contents: write

jobs:
  import-history:
    if: github.repository == 'teddyfresnes/Backrooms'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Verify and import the dated archive
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          git clone --bare --filter=blob:none --depth=1 --single-branch \
            --branch "$GITHUB_REF_NAME" \
            "https://github.com/$GITHUB_REPOSITORY.git" \
            "$RUNNER_TEMP/movement-import.git"
          cd "$RUNNER_TEMP/movement-import.git"
          git show HEAD:.history-import/import-history.py > "$RUNNER_TEMP/import-history.py"
          python3 "$RUNNER_TEMP/import-history.py"
