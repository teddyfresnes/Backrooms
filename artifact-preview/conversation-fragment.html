<style>
@import url('https://cdn.jsdelivr.net/gh/teddyfresnes/Backrooms@2309d02266aa72a1d5f317f30f48dfb31594d136/character-preview/preview.css');
#backrooms-artifact { position:relative; isolation:isolate; contain:layout paint; transform:translateZ(0); width:100%; height:540px; overflow:hidden; background:#a79c6d; color:#f4f0d9; font:400 14px/1.4 system-ui,sans-serif; }
#backrooms-artifact > canvas { display:block; width:100%; height:100%; touch-action:none; }
#backrooms-artifact .backrooms-wordmark { position:absolute; z-index:12; top:16px; left:18px; pointer-events:none; text-shadow:0 1px 9px #201f14b0; letter-spacing:.15em; font-size:12px; font-weight:500; }
#backrooms-artifact .backrooms-wordmark small { display:block; margin-top:2px; letter-spacing:.025em; font-size:11px; font-weight:400; opacity:.8; }
#backrooms-artifact [data-status] { position:absolute; z-index:20; inset:0; display:grid; place-items:center; padding:25px; text-align:center; color:#f4f0d9; background:radial-gradient(ellipse at center,#635f3e99,#292c23e8); }
#backrooms-artifact [data-status][hidden], #backrooms-artifact [data-console][hidden] { display:none; }
#backrooms-artifact .backrooms-crosshair { position:absolute; z-index:9; top:50%; left:50%; width:3px; height:3px; margin:-1.5px; border-radius:50%; background:#fffae7aa; pointer-events:none; }
#backrooms-artifact .backrooms-keys { position:absolute; z-index:12; bottom:12px; left:12px; right:12px; text-align:center; pointer-events:none; font-size:11px; color:#f4f0d9; text-shadow:0 1px 6px #111e; }
#backrooms-artifact [data-console] { position:absolute; z-index:100; left:16px; right:16px; bottom:46px; padding:12px; background:#171a15f5; color:#f4f0d9; border:1px solid #f4f0d93b; }
#backrooms-artifact [data-console] label { display:block; margin-bottom:6px; font-size:11px; letter-spacing:.08em; }
#backrooms-artifact [data-console] input { box-sizing:border-box; display:block; width:100%; padding:10px; border:1px solid #d5c99155; border-radius:2px; background:#0d110e; color:#f4f0d9; font:400 16px/1.3 ui-monospace,monospace; }
#backrooms-artifact [data-feedback] { display:block; min-height:1.4em; margin-top:5px; font-size:11px; }
#backrooms-artifact .pair-hud { bottom:52px; }
#backrooms-artifact .pair-hud, #backrooms-artifact .emote-panel { max-width:calc(100% - 24px); }
#backrooms-artifact .emote-panel--collection { max-height:400px; }
#backrooms-artifact .emote-panel--pair { max-height:400px; }
@media(max-width:480px) { #backrooms-artifact { height:480px; } #backrooms-artifact .backrooms-keys { font-size:11px; } #backrooms-artifact .backrooms-wordmark { left:12px; top:12px; } }
</style>
<div id="backrooms-artifact" role="region" aria-label="Aperçu jouable des mouvements de Backrooms">
  <div class="backrooms-wordmark">BACKROOMS<small>Aperçu des mouvements intégrés</small></div>
  <div data-status role="status" aria-live="polite">Préparation des personnages…</div>
  <div class="backrooms-crosshair" aria-hidden="true"></div>
  <div class="backrooms-keys">ZQSD · Maj · Espace · Ctrl · E · Tab · /viewmodel</div>
  <form data-console hidden autocomplete="off">
    <label for="backrooms-command">COMMANDE</label>
    <input id="backrooms-command" aria-label="Commande du jeu" placeholder="/viewmodel" spellcheck="false" autocapitalize="off">
    <output data-feedback aria-live="polite"></output>
  </form>
</div>
<script type="module">
const root = document.getElementById('backrooms-artifact');
import('https://cdn.jsdelivr.net/gh/teddyfresnes/Backrooms@2309d02266aa72a1d5f317f30f48dfb31594d136/character-preview/preview.mjs').catch(error => {
  const status = root.querySelector('[data-status]');
  status.hidden = false;
  status.setAttribute('role', 'alert');
  status.textContent = 'Le chargement de l’aperçu a échoué. Rouvre l’aperçu pour réessayer.';
  console.error(error);
});
</script>
